name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: master
  workflow_run:
    workflows: [Docker]
    branches: [master]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to configured server
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read

    steps:
      - name: Check out production commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare immutable deploy bundle
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$REQUESTED_REF" = master
          fi

          git fetch --no-tags origin master
          deploy_sha="$(git rev-parse 'HEAD^{commit}')"
          test "$deploy_sha" = "$(git rev-parse 'refs/remotes/origin/master^{commit}')"

          cleanup_ref() {
            git update-ref -d refs/scout-deploy/candidate >/dev/null 2>&1 || true
          }
          trap cleanup_ref EXIT
          git update-ref refs/scout-deploy/candidate "$deploy_sha"
          git bundle create "$RUNNER_TEMP/scout-deploy.bundle" refs/scout-deploy/candidate
          git bundle verify "$RUNNER_TEMP/scout-deploy.bundle" >/dev/null
          printf 'DEPLOY_SHA=%s\n' "$deploy_sha" >> "$GITHUB_ENV"

      - name: Configure pinned SSH trust
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_TARGET_KNOWN_HOSTS: ${{ vars.DEPLOY_TARGET_KNOWN_HOSTS }}
          DEPLOY_BASTION_HOST: ${{ vars.DEPLOY_BASTION_HOST }}
          DEPLOY_BASTION_PORT: ${{ vars.DEPLOY_BASTION_PORT || '22' }}
          DEPLOY_BASTION_USER: ${{ vars.DEPLOY_BASTION_USER }}
          DEPLOY_BASTION_KNOWN_HOSTS: ${{ vars.DEPLOY_BASTION_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_TARGET_KNOWN_HOSTS"
          case "$DEPLOY_PORT" in *[!0-9]*|'') printf '%s\n' "DEPLOY_PORT must be numeric" >&2; exit 1 ;; esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_TARGET_KNOWN_HOSTS" > ~/.ssh/known_hosts

          if [ -n "$DEPLOY_BASTION_HOST" ] || [ -n "$DEPLOY_BASTION_USER" ] || [ -n "$DEPLOY_BASTION_KNOWN_HOSTS" ]; then
            test -n "$DEPLOY_BASTION_HOST"
            test -n "$DEPLOY_BASTION_USER"
            test -n "$DEPLOY_BASTION_KNOWN_HOSTS"
            case "$DEPLOY_BASTION_PORT" in *[!0-9]*|'') printf '%s\n' "DEPLOY_BASTION_PORT must be numeric" >&2; exit 1 ;; esac
            printf '%s\n' "$DEPLOY_BASTION_KNOWN_HOSTS" >> ~/.ssh/known_hosts
            ssh-keygen -F "$DEPLOY_BASTION_HOST" -f ~/.ssh/known_hosts >/dev/null
            ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null
            {
              printf '%s\n' 'Host deploy-bastion'
              printf '  HostName %s\n' "$DEPLOY_BASTION_HOST"
              printf '  Port %s\n' "$DEPLOY_BASTION_PORT"
              printf '  User %s\n' "$DEPLOY_BASTION_USER"
              printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
              printf '%s\n' '  IdentitiesOnly yes'
              printf '%s\n' '  StrictHostKeyChecking yes'
              printf '%s\n' '  UserKnownHostsFile ~/.ssh/known_hosts'
              printf '%s\n' '  GlobalKnownHostsFile /dev/null'
              printf '\n'
              printf '%s\n' 'Host deploy-target'
              printf '  HostName %s\n' "$DEPLOY_HOST"
              printf '  Port %s\n' "$DEPLOY_PORT"
              printf '  User %s\n' "$DEPLOY_USER"
              printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
              printf '%s\n' '  IdentitiesOnly yes'
              printf '%s\n' '  ProxyJump deploy-bastion'
              printf '%s\n' '  StrictHostKeyChecking yes'
              printf '%s\n' '  UserKnownHostsFile ~/.ssh/known_hosts'
              printf '%s\n' '  GlobalKnownHostsFile /dev/null'
            } > ~/.ssh/config
          else
            ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null
            {
              printf '%s\n' 'Host deploy-target'
              printf '  HostName %s\n' "$DEPLOY_HOST"
              printf '  Port %s\n' "$DEPLOY_PORT"
              printf '  User %s\n' "$DEPLOY_USER"
              printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
              printf '%s\n' '  IdentitiesOnly yes'
              printf '%s\n' '  StrictHostKeyChecking yes'
              printf '%s\n' '  UserKnownHostsFile ~/.ssh/known_hosts'
              printf '%s\n' '  GlobalKnownHostsFile /dev/null'
            } > ~/.ssh/config
          fi
          chmod 600 ~/.ssh/config

      - name: Deploy with backup
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_COMPOSE_FILE: ${{ vars.DEPLOY_COMPOSE_FILE || 'docker-compose.yml' }}
          DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE || 'scout' }}
          DEPLOY_IMAGE: ${{ vars.DEPLOY_IMAGE || 'scout-local:master' }}
          DEPLOY_SOURCE_PATH: ${{ vars.DEPLOY_SOURCE_PATH }}
          DEPLOY_BACKUP_PATH: ${{ vars.DEPLOY_BACKUP_PATH || 'backups' }}
        run: |
          set -eu
          test -n "$DEPLOY_SHA"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SERVICE"
          test -n "$DEPLOY_IMAGE"
          test -n "$DEPLOY_SOURCE_PATH"

          remote_bundle="/tmp/scout-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          remote_uploaded=0
          cleanup_remote() {
            if [ "$remote_uploaded" -eq 1 ]; then
              # shellcheck disable=SC2029
              ssh deploy-target rm -f "$remote_bundle" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_remote EXIT
          scp -p "$RUNNER_TEMP/scout-deploy.bundle" deploy-target:"$remote_bundle"
          remote_uploaded=1

          # shellcheck disable=SC2029
          ssh deploy-target 'sh -s' \
            "$DEPLOY_SHA" "$DEPLOY_PATH" "$DEPLOY_COMPOSE_FILE" "$DEPLOY_SERVICE" "$DEPLOY_IMAGE" "$DEPLOY_SOURCE_PATH" "$DEPLOY_BACKUP_PATH" "$remote_bundle" <<'REMOTE'
          set -eu

          deploy_sha="$1"
          deploy_path="$2"
          compose_file="$3"
          service="$4"
          image="$5"
          source_path="$6"
          backup_path="$7"
          bundle_path="$8"
          candidate_ref="refs/scout-deploy/candidate"

          cleanup_bundle() {
            rm -f "$bundle_path"
            if [ -d "$source_path/.git" ]; then
              git -C "$source_path" update-ref -d "$candidate_ref" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_bundle EXIT

          cd "$deploy_path"
          docker compose -f "$compose_file" config >/tmp/scout-deploy-compose.yml

          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          backup_dir="$deploy_path/$backup_path/$ts"
          mkdir -p "$backup_dir"
          docker compose -f "$compose_file" config > "$backup_dir/docker-compose.config.yml"

          container="$(docker compose -f "$compose_file" ps -q "$service" || true)"
          if [ -n "$container" ]; then
            docker inspect "$container" > "$backup_dir/$service-container-inspect.json"
            docker inspect "$container" --format '{{range .Mounts}}{{println .Type .Name .Source .Destination}}{{end}}' |
            while read -r type name source destination; do
              [ -n "$type" ] || continue
              safe="$(printf '%s-%s' "$type" "${name:-$destination}" | tr '/ :' '___')"
              case "$type" in
                volume)
                  docker run --rm -v "$name:/mnt/source:ro" -v "$backup_dir:/backup" alpine sh -c "tar -czf /backup/$safe.tgz -C /mnt/source ."
                  ;;
                bind)
                  if [ -e "$source" ]; then
                    docker run --rm -v "$source:/mnt/source:ro" -v "$backup_dir:/backup" alpine sh -c "tar -czf /backup/$safe.tgz -C /mnt/source ."
                  fi
                  ;;
              esac
            done
          fi

          if [ ! -d "$source_path/.git" ]; then
            mkdir -p "$source_path"
            git -C "$source_path" init
          fi
          test -z "$(git -C "$source_path" status --porcelain)"
          git -C "$source_path" fetch --no-tags "$bundle_path" \
            "+refs/scout-deploy/candidate:$candidate_ref"
          test "$(git -C "$source_path" rev-parse "${candidate_ref}^{commit}")" = "$deploy_sha"
          git -C "$source_path" checkout -B master "$candidate_ref"
          git -C "$source_path" reset --hard "$candidate_ref"
          docker build -t "$image" "$source_path"

          docker compose -f "$compose_file" up -d --remove-orphans "$service"
          docker compose -f "$compose_file" ps
          echo "backup_dir=$backup_dir"
          REMOTE
          remote_uploaded=0

      - name: Verify health
        env:
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          set -eu
          test -n "$DEPLOY_HEALTH_URL"
          curl -fsS "$DEPLOY_HEALTH_URL"
